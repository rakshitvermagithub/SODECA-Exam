<!-- 1. The container for all flash messages -->
<div id="flash-message-container"></div>

<!-- 2. CSS with the new slide-out animation -->
<style>
    #flash-message-container {
        position: fixed;
        top: 80px; /* Adjust based on your navbar height */
        right: 20px;
        z-index: 1056;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .flash-alert {
        width: 350px;
        max-width: 90vw;
        background-color: white;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        border-radius: 6px;
        padding: 1rem;
        display: flex;
        align-items: center;
        border: 1px solid;
        animation: slideInFromRight 0.35s ease-out forwards;
    }

    .flash-alert.closing {
        animation: slideOutToRight 0.28s ease-in forwards;
    }

    @keyframes slideInFromRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
    
    @keyframes slideOutToRight {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(110%); opacity: 0; }
    }

    .flash-alert .flash-icon {
        font-size: 1.25rem;
        margin-right: 0.75rem;
    }

    .flash-alert.danger { color: #dc3545; }
    .flash-alert.success { color: #198754; }
    .flash-alert.warning { color: #664d03; }
    .flash-alert.info { color: #0dcaf0; }
</style>

<!-- 3. The JavaScript logic (CORRECTED) -->
<script>
    // --- FUNCTION IS NOW GLOBAL ---
    // Moved the function definition outside of the DOMContentLoaded listener.
    // Now other scripts (like on sodeca_forms.html) can find and call it.
    function showFlashMessage(message, category = 'info', duration = 4000) {
        const container = document.getElementById('flash-message-container');
        if (!container) return;

        const icons = {
            success: 'bi-check-circle-fill',
            danger: 'bi-exclamation-circle-fill',
            warning: 'bi-exclamation-circle-fill',
            info: 'bi-info-circle-fill'
        };

        const alertDiv = document.createElement('div');
        alertDiv.className = `flash-alert ${category}`;
        const iconClass = icons[category] || icons.info;

        alertDiv.innerHTML = `
            <i class="bi ${iconClass} flash-icon"></i>
            <span>${message}</span>
        `;
        
        container.appendChild(alertDiv);

        const animationDuration = 400; 
        setTimeout(() => {
            alertDiv.classList.add('closing');
            
            setTimeout(() => {
                alertDiv.remove();
            }, animationDuration);

        }, duration);
    }

    // This part *waits* for the page to load, then calls the global function
    // for any messages flashed from the Flask backend.
    document.addEventListener('DOMContentLoaded', function() {
        try {
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        showFlashMessage({{ message|tojson }}, {{ category|tojson }});
                    {% endfor %}
                {% endif %}
            {% endwith %}
        } catch (e) {
            console.error("Error displaying flashed messages:", e);
        }
    });
</script>
