<style>
    /* Google Auth Button Styling */
    .btn-google {
        background-color: #ffffff;
        color: #1f1f1f;
        border: 1px solid #c3c5c6;
        border-radius: 4px; 
        padding: 10px 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s ease, box-shadow 0.2s ease;
        font-size: 14px;
        letter-spacing: 0.2px;
    }

    .btn-google:hover {
        background-color: #f8f9fa; 
        box-shadow: 0 1px 3px rgba(60,64,67,0.3);
        color: #1f1f1f;
        border-color: #dadce0;
    }

    .btn-google:active {
        background-color: #eeeeee;
    }

    .google-icon {
        width: 18px;
        height: 18px;
        margin-right: 12px;
    }

    /* --- ENHANCED FLASH MESSAGE UI --- */
    #flash-message-container {
        position: fixed;
        top: 80px; 
        right: 20px;
        z-index: 1056;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .flash-alert {
        width: 360px;
        max-width: 90vw;
        border-radius: 8px;
        padding: 1rem 1.25rem;
        display: flex;
        align-items: flex-start;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        background-color: #ffffff; /* White background */
        color: #212529; /* Dark text */
        position: relative;
        overflow: hidden;
        animation: slideInFromRight 0.35s ease-out forwards;
    }

    .flash-alert.closing {
        animation: slideOutToRight 0.28s ease-in forwards;
    }

    @keyframes slideInFromRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
    
    @keyframes slideOutToRight {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(110%); opacity: 0; }
    }

    /* CSS Variables for Dynamic Themes */
    .flash-alert.danger { --toast-theme: #ea1a2e; }
    .flash-alert.success { --toast-theme: #03aa5c; }
    .flash-alert.info { --toast-theme: #0380e5; }
    .flash-alert.warning { --toast-theme: #ffcc00; }

    .flash-alert .flash-icon {
        font-size: 1.25rem;
        margin-right: 0.85rem;
        margin-top: 1px;
        color: var(--toast-theme); /* Colored Icon */
    }

    .flash-content {
        flex-grow: 1;
        font-size: 0.95rem;
        font-weight: 500;
        line-height: 1.4;
        word-wrap: break-word;
    }

    /* Manual Dismiss Button */
    .flash-close-btn {
        background: none;
        border: none;
        color: #adb5bd; /* Subtle close button */
        font-size: 1.2rem;
        cursor: pointer;
        padding: 0;
        margin-left: 10px;
        transition: opacity 0.2s, color 0.2s;
        line-height: 1;
    }
    
    .flash-close-btn:hover {
        color: #495057;
        opacity: 1;
    }

    /* Visual Timer Progress Bar */
    .flash-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 4px;
        background-color: var(--toast-theme); /* Colored Progress Bar */
        animation: shrinkProgress 3s linear forwards; 
    }

    @keyframes shrinkProgress {
        from { width: 100%; }
        to { width: 0%; }
    }
</style>

<div id="flash-message-container"></div>

<div class="modal fade" id="driveAuthModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-3 p-1">
            
            <div class="modal-header mb-3">
                <h5 class="modal-title fw-bold fs-5">Permission Required</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body text-center pb-3 pt-2">
                <a href="/authorize_drive" class="btn btn-google mb-3">
                    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" class="google-icon">
                    <span class="fw-medium">Authorize google drive</span>
                </a>
    
                <p class="text-muted fw-medium fs-6">
                    To perform this action, you need to authorize access to Google Drive.
                </p>
            </div>
            
        </div>
    </div>
</div>

<script>
    // --- Global Function for Standard Toasts ---
    function showFlashMessage(message, category = 'info', duration = 3000) {
        const container = document.getElementById('flash-message-container');
        if (!container) return;

        const icons = {
            success: 'bi-check-circle-fill',
            danger: 'bi-exclamation-triangle-fill',
            warning: 'bi-exclamation-triangle-fill',
            info: 'bi-info-circle-fill'
        };

        const alertDiv = document.createElement('div');
        // If category is weird, default to info
        alertDiv.className = `flash-alert ${icons[category] ? category : 'info'}`;
        const iconClass = icons[category] || icons.info;

        alertDiv.innerHTML = `
            <i class="bi ${iconClass} flash-icon"></i>
            <div class="flash-content">${message}</div>
            <button class="flash-close-btn" aria-label="Close"><i class="bi bi-x-lg"></i></button>
            <div class="flash-progress"></div>
        `;
        
        container.appendChild(alertDiv);

        // Function to smoothly dismiss the alert 
        const dismissAlert = () => {
            alertDiv.classList.add('closing');
            setTimeout(() => {
                alertDiv.remove();
            }, 280); // Wait for the slideOutToRight animation to complete
        };

        // Attach event listener to the close button
        const closeBtn = alertDiv.querySelector('.flash-close-btn');
        closeBtn.addEventListener('click', dismissAlert);

        // Auto dismiss after duration
        setTimeout(dismissAlert, duration);
    }

    // --- Page Load Logic ---
    document.addEventListener('DOMContentLoaded', function() {
        try {
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        
                        // Check for specific 'drive_auth_popup' category
                        {% if category == 'drive_auth_popup' %}
                            // 1. Trigger the Modal
                            const modalEl = document.getElementById('driveAuthModal');
                            if (modalEl) {
                                const authModal = new bootstrap.Modal(modalEl);
                                authModal.show();
                            }
                        {% else %}
                            // 2. Otherwise, show standard Toast
                            showFlashMessage({{ message|tojson }}, {{ category|tojson }});
                        {% endif %}

                    {% endfor %}
                {% endif %}
            {% endwith %}
        } catch (e) {
            console.error("Error displaying flashed messages:", e);
        }
    });
</script>
