<!-- 1. The container for all flash messages -->
<!-- IMPORTANT: Make sure you have the Bootstrap Icons stylesheet linked in your main layout.html file for the icons to appear! -->
<div id="flash-message-container"></div>

<!-- 2. CSS with the new slide-out animation -->
<style>
    #flash-message-container {
        position: fixed;
        top: 80px; /* Adjust based on your navbar height */
        right: 20px;
        z-index: 1056;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .flash-alert {
        width: 350px;
        max-width: 90vw;
        background-color: white;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        border-radius: 6px;
        padding: 1rem;
        display: flex;
        align-items: center;
        border: 1px solid;
        animation: slideInFromRight 0.35s ease-out forwards; /* Added 'forwards' */
    }

    /* --- NEW --- Add a class for the closing animation */
    .flash-alert.closing {
        animation: slideOutToRight 0.28s ease-in forwards;
    }

    /* Animation for the alert appearing */
    @keyframes slideInFromRight {
        from {
            transform: translateX(100%);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }
    
    /* --- NEW --- Animation for the alert disappearing */
    @keyframes slideOutToRight {
        from {
            transform: translateX(0);
            opacity: 1;
        }
        to {
            transform: translateX(110%); /* Move slightly further out */
            opacity: 0;
        }
    }


    .flash-alert .flash-icon {
        font-size: 1.25rem;
        margin-right: 0.75rem;
    }

    /* Category-specific text, icon, and border colors */
    .flash-alert.danger { color: #dc3545; }
    .flash-alert.success { color: #198754; }
    .flash-alert.warning { color: #664d03; }
    .flash-alert.info { color: #0dcaf0; }

</style>

<!-- 3. The JavaScript logic updated for the new animation -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    function showFlashMessage(message, category = 'info', duration = 3000) {
        const container = document.getElementById('flash-message-container');
        if (!container) return;

        const icons = {
            success: 'bi-check-circle-fill',
            danger: 'bi-exclamation-circle-fill',
            warning: 'bi-exclamation-circle-fill',
            info: 'bi-info-circle-fill'
        };

        const alertDiv = document.createElement('div');
        alertDiv.className = `flash-alert ${category}`;
        const iconClass = icons[category] || icons.info;

        alertDiv.innerHTML = `
            <i class="bi ${iconClass} flash-icon"></i>
            <span>${message}</span>
        `;
        
        container.appendChild(alertDiv);

        // Set a timeout to add the closing animation, then remove the element
        const animationDuration = 400; // Corresponds to the 0.4s in CSS
        setTimeout(() => {
            alertDiv.classList.add('closing');
            
            // Wait for the slide-out animation to finish before removing the element
            setTimeout(() => {
                alertDiv.remove();
            }, animationDuration);

        }, duration);
    }

    // --- Connects Jinja to JavaScript (No changes here) ---
    try {
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    showFlashMessage({{ message|tojson }}, {{ category|tojson }});
                {% endfor %}
            {% endif %}
        {% endwith %}
    } catch (e) {
        console.error("Error displaying flashed messages:", e);
    }
});
</script>
