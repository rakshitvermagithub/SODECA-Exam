{% extends "layout.html" %}

{% block title %}
    Student Details
{% endblock %}

{% block css %}
<style>
    .page-wrapper {
        min-height: calc(100vh - 56px);
        background-color: #f0f2f5;
        padding-top: 2rem;
        padding-bottom: 2rem;
    }

    .card-minimalist {
        border: none;
        border-top: 5px solid var(--bs-primary);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        border-radius: 0.5rem;
    }

    .form-title {
        position: relative;
        padding-bottom: 0.5rem;
    }

    .form-title::after {
        content: '';
        position: absolute;
        display: block;
        width: 50px;
        height: 3px;
        background: var(--bs-primary);
        border-radius: 2px;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
    }

    /* Force uppercase visually before JS processes it */
    #universityRollNo {
        text-transform: uppercase;
    }
</style>
{% endblock %}

{% block main %}
{% include "message.html" %}
<div class="page-wrapper d-flex justify-content-center align-items-center">
    <div class="card shadow p-4" style="max-width: 600px; width: 85%;">
        <div class="card-body">
            <h3 class="card-title text-center mb-4 form-title">Student Details</h3>

            <form action="/student_details" id="detailsForm" method="post" novalidate>
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="universityRollNo" name="university_roll_no" placeholder="University Roll No." value="{{ details.university_roll_no | default('')}}" required>
                            <label for="universityRollNo">University Roll No.</label>
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                    <div class="col-md-12 mb-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="stdName" name="student_name" placeholder="Name of the Student" value="{{ details.student_name | default('')}}" required>
                            <label for="stdName">Name of the Student</label>
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <div class="form-floating">
                            <select class="form-select" id="semester" name="semester_option" required>
                                <option value="" {% if not details %}selected{% endif %}>Choose...</option>
                                {% for sem_dict in semester %}
                                {% set sem = sem_dict["sem"] %}
                                <option value="{{sem}}" {% if details and details.semester|string == sem[]|string %}selected{% endif %}>{{sem}}</option>
                                {% endfor %}
                            </select>
                            <label for="semester">Semester</label>
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <div class="form-floating">
                            <select class="form-select" id="branch" name="branch_option" required>
                                <option value="" {% if not details %}selected{% endif %}>Choose...</option>
                                {% for branch_dict in branches %}
                                {% set branch = branch_dict["branch"] %}
                                <option value="{{branch}}" {% if details and details.branch == branch %}selected{% endif %}>{{ branch }}</option>
                                {% endfor %}
                            </select>
                            <label for="branch">Branch</label>
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="form-floating">
                            <select class="form-select" id="section" name="section_option" required>
                                <option value="" {% if not details %}selected{% endif %}>Choose...</option>
                                <option value="{{batch}}" {% if details and details.section == batch %}selected{% endif %}>{{ batch }}</option>
                            </select>
                            <label for="section">Section</label>
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                     <div class="form-floating">
                        <input id="batchCounselor" class="form-control" type="text"
                            {% if batch_counselor_name %} value="{{ batch_counselor_name }}"
                            {% else %} value="To be assigned..."{% endif %}
                        disabled>
                        <label for="batchCounselor">Batch Counselor</label>
                        <div class="form-text mt-1"><span class="text-secondary bg-warning-subtle">*Updates respective to the saved batch details.</span></div>
                        <div class="invalid-feedback"></div>
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary" style="width: 120px;">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('detailsForm');
    const allInputs = form.querySelectorAll('input[required], select[required]');
    const stdNameInput = document.getElementById('stdName');
    const rollNoInput = document.getElementById('universityRollNo');

    // --- Define the valid options for each dropdown ---
    const validOptions = {
        branch: ["CSE", "CSE(AI)", "CSE(DS)", "CSE(IOT)"],
        semester: ["1", "2", "3", "4", "5", "6", "7", "8"],
        section: ["A", "B", "C", "D", "E", "F"],
        group: ["G1", "G2", "B1", "E1", "E2"],
        // This array is dynamically created by Jinja to validate against
        batchCounselor: [
            {% for faculty in faculty_list %}
                "{{ faculty.full_name }}",
            {% endfor %}
        ]
    };

    const showValidation = (input, isValid, message) => {
        const feedback = input.parentElement.querySelector('.invalid-feedback');
        if (isValid) {
            input.classList.remove('is-invalid');
            input.classList.add('is-valid');
            if (feedback) feedback.textContent = '';
        } else {
            input.classList.remove('is-valid');
            input.classList.add('is-invalid');
            if (feedback) feedback.textContent = message;
        }
    };

    // Generic validator for any required field
    const validateRequired = (input) => {
        if (!input.value || input.value.trim() === '') {
            showValidation(input, false, 'This field is required.');
            return false;
        }
        showValidation(input, true, '');
        return true;
    };

    // Specific validator for the student's name
    const validateName = (input) => {
        if (!validateRequired(input)) {
            return false;
        }
        // Regex to allow letters (including unicode), spaces, dots, and hyphens
        const nameRegex = /^[A-Za-z\s.-]+$/;
        if (!nameRegex.test(input.value)) {
            showValidation(input, false, 'Name can only contain letters, spaces, dots, and hyphens.');
            return false;
        }
        showValidation(input, true, '');
        return true;
    };

    // Specific validator for the Roll Number
    const validateRollNo = (input) => {
        if (!validateRequired(input)) {
            return false;
        }
        // If it reaches here without special characters, it's valid
        showValidation(input, true, '');
        return true;
    };

    // --- HELPER: Convert text to Title Case ---
    const toTitleCase = (str) => {
        return str.toLowerCase().replace(/\b\w/g, char => char.toUpperCase());
    };

    function updateSectionDropdown(sections) {
        const sectionSelect = document.getElementById('section');
        if (!sectionSelect) return;

        // 1. Save the currently selected value (useful for initial page load edits)
        const currentValue = sectionSelect.value;

        // 2. Clear all existing options except the first "Choose..." placeholder
        // We keep index 0 intact to preserve the layout structure
        while (sectionSelect.options.length > 1) {
            sectionSelect.remove(1);
        }

        // 3. Loop through the fetched sections array and append new option elements
        sections.forEach(sec => {
            const option = document.createElement('option');
            option.value = sec;
            option.textContent = sec;

            // If this option matches the user's previous selection, keep it selected
            if (sec === currentValue) {
                option.selected = true;
            }

            sectionSelect.appendChild(option);
        });

        // 4. Force Bootstrap floating label layout engine to recalculate state
        sectionSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }

    const sectionCache = {}; // Form: { "5_CSE": ["A-G1", "A-G2"] }

    // Dedicated function to handle dropdown adjustments
    async function checkAndFetchSections() {
        const semSelect = document.getElementById('semester');
        const branchSelect = document.getElementById('branch');

        if (!semSelect || !branchSelect) return;

        const semValue = semSelect.value;
        const branchValue = branchSelect.value;

        // 1. Ensure both fields are filled
        if (!semValue || !branchValue) return;

        // 2. Validate values against your validOptions object
        const isSemValid = validOptions.semester.includes(semValue);
        const isBranchValid = validOptions.branch.includes(branchValue);

        if (!isSemValid || !isBranchValid) {
            console.warn("Invalid semester or branch selected.");
            return;
        }

        // 3. Values are verified; proceed with caching/fetching logic
        const cacheKey = `${semValue}_${branchValue}`;

        if (sectionCache[cacheKey]) {
            updateSectionDropdown(sectionCache[cacheKey]);
            return;
        }

        try {
            // Safe to fetch now because inputs match your server's expected validation rules
            const response = await fetch(`/api/sections?sem=${encodeURIComponent(semValue)}&branch=${encodeURIComponent(branchValue)}`);
            if (!response.ok) throw new Error("Network response error");
            
            const sections = await response.json();
            
            sectionCache[cacheKey] = sections; 
            updateSectionDropdown(sections);
        } catch (error) {
            console.error("Failed to fetch matching sections:", error);
        }
    }

    // 4. Attach event listeners when the DOM mounts
    const semSelect = document.getElementById('semester');
    const branchSelect = document.getElementById('branch');

    if (semSelect) semSelect.addEventListener('change', checkAndFetchSections);
    if (branchSelect) branchSelect.addEventListener('change', checkAndFetchSections);

    // Run immediately on page load to catch pre-filled backend values
    if (semSelect?.value && branchSelect?.value) {
        checkAndFetchSections();
    }

    // --- REAL-TIME Roll Number uppercase & special character check ---
    rollNoInput.addEventListener('input', function(e) {
        const cursorPosition = this.selectionStart;
        const originalLength = this.value.length;
        
        // Check if a special character was typed (anything not a letter or number)
        const hasSpecialChars = /[^a-zA-Z0-9]/g.test(this.value);

        // Remove special chars and force uppercase
        let sanitizedValue = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();

        if (this.value !== sanitizedValue) {
            this.value = sanitizedValue;
            
            // Restore cursor position
            const newLength = this.value.length;
            this.setSelectionRange(cursorPosition - (originalLength - newLength), cursorPosition - (originalLength - newLength));
        }

        // Show real-time error if special character was blocked
        if (hasSpecialChars) {
            showValidation(this, false, 'Special characters and spaces are not allowed.');
        } else if (this.value.trim() !== '') {
            // Clear error if they continue typing valid characters
            showValidation(this, true, '');
        } else {
            // If they deleted everything
            showValidation(this, false, 'This field is required.');
        }
    });

    // Add 'blur' event listeners to all required fields for instant feedback
    allInputs.forEach(input => {
        input.addEventListener('blur', () => {
            if (input.id === 'stdName') {
                // Apply Title Case formatting before validating
                if (input.value.trim() !== '') {
                    input.value = toTitleCase(input.value.trim());
                }
                validateName(input);
            } else if (input.id === 'universityRollNo') {
                validateRollNo(input);
            } else {
                validateRequired(input);
            }
        });
    });

    // Handle form submission
    form.addEventListener('submit', function(event) {
        let isFormValid = true;

        // 1. Check if all fields are filled using appropriate validators
        allInputs.forEach(input => {
            let isValid;
            if (input.id === 'stdName') {
                // Ensure it's title cased on final submission too just in case
                if (input.value.trim() !== '') {
                    input.value = toTitleCase(input.value.trim());
                }
                isValid = validateName(input);
            } else if (input.id === 'universityRollNo') {
                isValid = validateRollNo(input);
            } else {
                isValid = validateRequired(input);
            }
            if (!isValid) {
                isFormValid = false;
            }
        });

        // 2. Check the integrity of all dropdown values
        document.querySelectorAll('select[required]').forEach(select => {
            // The key for validOptions is the select element's id
            const optionKey = select.id;
            if (validOptions[optionKey] && !validOptions[optionKey].includes(select.value)) {
                showValidation(select, false, `Invalid ${optionKey} selected.`);
                isFormValid = false;
            }
        });
        
        // If any validation failed, prevent the form from submitting
        if (!isFormValid) {
            event.preventDefault();
            event.stopPropagation();
        }
    });
});
</script>
{% endblock %}
