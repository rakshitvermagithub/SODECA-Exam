{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block css %}
<style>

        min-height: calc(100vh - 56px - 1rem); /* Adjust 56px based on your navbar height */
    }
    .reg-icon {
        fill: #212529;
    }

    .form-title::after {

        position: absolute;
        display: block;
        width: 50px; /* Width of the line */

            <div class="d-flex align-items-center my-3">
                <hr class="flex-grow-1">
                <span class="px-2 text-muted text-uppercase small">or</span>
                <hr class="flex-grow-1">
            </div>

            <form action="{{ url_for('register') }}" id="registerForm" method="post" novalidate>
                <div class="mb-3">
                    <input type="email" class="form-control border-dark" id="collegeEmail" placeholder="Email" name="email" required>
                    <div class="invalid-feedback"></div>
                </div>

                <div class="mb-3">
                    <input type="password" class="form-control border border-dark" id="password" placeholder="Password" name="password" required>
                    <div class="invalid-feedback"></div>
                </div>

                <div class="mb-4">
                    <input type="password" class="form-control border border-dark" id="confirmPassword" placeholder="Confirm Password" name="confirm_password" required>
                    <div class="invalid-feedback"></div>
                </div>

                <div class="text-center mb-3">
                    <button class="btn btn-primary w-50" type="submit">Register</button>
                </div>
            </form>
            <div class="text-center">
                <span>
                    Already registered? <a href="{{ url_for('login') }}">Login</a>
                </span>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block script %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('registerForm');
    const email = document.getElementById('collegeEmail');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');

    // Helper function to show validation state
    const showValidation = (input, isValid, message) => {
        const feedback = input.parentElement.querySelector('.invalid-feedback');
        if (isValid) {
            input.classList.remove('is-invalid');
            input.classList.add('is-valid');
            feedback.textContent = '';
        } else {
            input.classList.remove('is-valid');
            input.classList.add('is-invalid');
            feedback.textContent = message;
        }
    };

    // 1. Email validation function
    const validateEmail = () => {
        const emailValue = email.value.trim();
        if (emailValue === '') {
            showValidation(email, false, 'Email is required.');
            return false;
        } 
        else if (!emailValue.endsWith('@skit.ac.in')) {
           showValidation(email, false, 'Email must be from the @skit.ac.in domain.');
          return false;
        } 
        else {
            showValidation(email, true, '');
            return true;
        }
    };

    // 2. Password validation function
    const validatePassword = () => {
        const passwordValue = password.value.trim();
        if (passwordValue.length < 8) {
            showValidation(password, false, 'Password must be at least 8 characters long.');
            return false;
        } else {
            showValidation(password, true, '');
            return true;
        }
    };

    // 3. Confirm Password validation function
    const validateConfirmPassword = () => {
        const passwordValue = password.value.trim();
        const confirmPasswordValue = confirmPassword.value.trim();
        
        // Don't show a "passwords do not match" error if the field is empty
        if (confirmPasswordValue === '') {
            showValidation(confirmPassword, false, 'Please confirm your password.');
            return false;
        } else if (confirmPasswordValue !== passwordValue) {
            showValidation(confirmPassword, false, 'Passwords do not match.');
            return false;
        } else {
            showValidation(confirmPassword, true, '');
            return true;
        }
    };

    // --- REVISED EVENT LISTENERS ---

    // Validate email when the user clicks away
    email.addEventListener('blur', validateEmail);

    // Validate password when the user clicks away
    password.addEventListener('blur', () => {
        validatePassword();
        // IMPORTANT: If confirm password has text, re-validate it now.
        if (confirmPassword.value.trim() !== '') {
            validateConfirmPassword();
        }
    });

    // Validate confirm password AS THE USER TYPES for instant feedback.
    // This is better UX for this specific field.
    confirmPassword.addEventListener('input', validateConfirmPassword);


    // Prevent form submission if validation fails
    form.addEventListener('submit', function(event) {
        // Run all validations one last time before submitting
        const isEmailValid = validateEmail();
        const isPasswordValid = validatePassword();
        const isConfirmPasswordValid = validateConfirmPassword();

        if (!isEmailValid || !isPasswordValid || !isConfirmPasswordValid) {
            event.preventDefault(); // Stop form submission
            event.stopPropagation();
        }
    });
});
</script>
{% endblock %}
