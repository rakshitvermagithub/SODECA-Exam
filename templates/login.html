{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block css %}
<style>
    .page-wrapper {
        min-height: calc(100vh - 56px);
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card-minimalist {
        border: none;
        border-top: 5px solid var(--bs-primary);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        border-radius: 0.5rem;
    }

    .form-title {
        position: relative;
        padding-bottom: 0.5rem;
    }

    .form-title::after {
        content: '';
        position: absolute;
        display: block;
        width: 50px;
        height: 3px;
        background: var(--bs-primary);
        border-radius: 2px;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
    }

    /* Set a fixed width for the icon to prevent layout shift */
    #togglePassword .fas {
        width: 1.1em;
    }
</style>
{% endblock %}

{% block main %}
{% include "message.html" %}
<div class="page-wrapper d-flex justify-content-center align-items-center">
    <div class="card p-4 m-4 shadow rounded-3 border-dark-subtle" style="max-width: 450px; width: 100%;">
        <div class="card-body">
            <h3 class="card-title text-center mb-4 form-title">Login</h3>

            <div class="d-flex justify-content-center">
                <button class="btn btn-outline-secondary d-flex align-items-center justify-content-center rounded-2 w-100 opacity-50" 
                        type="button"
                        disabled 
                        title="Not functional in demo version" 
                        style="cursor: not-allowed;">
                    <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="27px" height="27px" viewBox="0 0 48 48" class="me-1">
                        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
                        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
                        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path>
                        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
                    </svg>                    
                    <span class="fw-medium">Sign in with Google</span>
                </button>
            </div>

            <div class="d-flex align-items-center my-3">
                <hr class="flex-grow-1">
                <span class="px-2 text-muted text-uppercase small">or</span>
                <hr class="flex-grow-1">
            </div>

            <form action="/login" id="loginForm" method="post" novalidate>
                <input type="hidden" id="email" name="email">
                <input type="hidden" id="password" name="password">

                <div class="form-group mb-3">
                    <label for="studentSelect" class="form-label small fw-bold text-secondary">Login as Student (Demo)</label>
                    <select class="form-select border-dark p-2" id="studentSelect">
                        <option value="" selected disabled>-- Select a Demo Student --</option>
                        {% for student in students_list %}
                            <option value="{{ student.email }}" data-pass="{{ student.hash_password }}">{{ student.email }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label for="facultySelect" class="form-label small fw-bold text-secondary">Login as Faculty (Demo)</label>
                    <select class="form-select border-dark p-2" id="facultySelect">
                        <option value="" selected disabled>-- Select a Demo Faculty --</option>
                        {% for faculty in faculty_list %}
                            <option value="{{ faculty.email }}" data-pass="{{ faculty.hash_password }}">{{ faculty.email }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group mb-4">
                    <label class="form-label small fw-bold text-secondary">Administrative Access</label>
                    <button class="btn btn-outline-dark w-100 p-2 d-flex justify-content-between align-items-center" 
                    type="button" id="adminSelectBtn" data-email="{{ admin.email }}" data-pass="{{ admin.hash_password }}">
                        <span><i class="fa-solid fa-user-shield me-2"></i> Quick Login as Super Admin</span>
                        <i class="fa-solid fa-chevron-right small text-muted"></i>
                    </button>
                </div>

                <div class="text-center mb-3">
                    <button class="btn btn-primary w-50" type="submit" id="submitBtn" disabled>Login</button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
    $(document).ready(function() {
        const $emailInput = $('#email');
        const $passInput = $('#password');
        const $submitBtn = $('#submitBtn');
        const $studentSelect = $('#studentSelect');
        const $facultySelect = $('#facultySelect');
        const $adminBtn = $('#adminSelectBtn');

        function updateCredentials(email, password, selectToClear) {
            $emailInput.val(email);
            $passInput.val(password);
            if (selectToClear) selectToClear.val(""); 
            $submitBtn.removeAttr('disabled');
        }

        $studentSelect.on('change', function() {
            const selectedOpt = $(this).find('option:selected');
            updateCredentials(selectedOpt.val(), selectedOpt.data('pass'), $facultySelect);
            $adminBtn.removeClass('btn-dark').addClass('btn-outline-dark');
        });

        $facultySelect.on('change', function() {
            const selectedOpt = $(this).find('option:selected');
            updateCredentials(selectedOpt.val(), selectedOpt.data('pass'), $studentSelect);
            $adminBtn.removeClass('btn-dark').addClass('btn-outline-dark');
        });

        $adminBtn.on('click', function() {
            updateCredentials($(this).data('email'), $(this).data('pass'), null);
            $studentSelect.val("");
            $facultySelect.val("");
            $(this).removeClass('btn-outline-dark').addClass('btn-dark');
        });
    });
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('loginForm');
        const email = document.getElementById('email');
        const password = document.getElementById('password');

        // Helper function to show validation state on dropdown wrappers instead of hidden fields
        const showValidation = (isValid, message) => {
            // Target an arbitrary visible dropdown group to present validation errors globally
            const feedbackContainer = document.querySelector('.form-group .invalid-feedback') || form;
            
            if (!isValid) {
                alert(message); // Standard fallback notification for quick tracking
            }
        };

        // Validates that the hidden inputs have been updated by selection
        const validateSelection = () => {
            const emailValue = email.value.trim();
            const passwordValue = password.value.trim();

            if (emailValue === '' || passwordValue === '') {
                showValidation(false, 'Please select a profile or administrative access to log in.');
                return false;
            }
            return true;
        };

        // Intercept form submissions
        form.addEventListener('submit', function(event) {
            const isFormValid = validateSelection();

            if (!isFormValid) {
                event.preventDefault();
                event.stopPropagation();
            }
        });
    });
</script>
{% endblock %}
