{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block css %}
<style>
    .page-wrapper {
        min-height: calc(100vh - 56px);
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card-minimalist {
        border: none;
        border-top: 5px solid var(--bs-primary);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        border-radius: 0.5rem;
    }

    .form-title {
        position: relative;
        padding-bottom: 0.5rem;
    }

    .form-title::after {
        content: '';
        position: absolute;
        display: block;
        width: 50px;
        height: 3px;
        background: var(--college-blue);
        border-radius: 2px;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
    }

    /* Set a fixed width for the icon to prevent layout shift */
    #togglePassword .fas {
        width: 1.1em;
    }
</style>
{% endblock %}

{% block main %}
{% include "message.html" %}
<div class="page-wrapper d-flex justify-content-center align-items-center">
    <div class="card p-4 m-4 shadow rounded-3 border-dark-subtle" style="max-width: 450px; width: 100%;">
        <div class="card-body">
            <h3 class="card-title text-center mb-4 form-title">Login</h3>

            <div class="d-flex justify-content-center">
                <a href="{{ url_for('google_login') }}" class="btn btn-outline-secondary d-flex align-items-center justify-content-center rounded-2">
                    <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="27px" height="27px" viewBox="0 0 48 48" class="me-1">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
                    </svg>                    
                    <span class="fw-medium">Sign in with Google</span>
                </a>
            </div>

            <div class="d-flex align-items-center my-3">
                <hr class="flex-grow-1">
                <span class="px-2 text-muted text-uppercase small">or</span>
                <hr class="flex-grow-1">
            </div>

            <form action="/login" id="loginForm" method="post" novalidate>
                <!-- Email Input -->
                <div class="form-group mb-3">
                    <input class="form-control p-2 border-dark" id="email" type="email" placeholder="Email" name="email" required>
                    <div class="invalid-feedback"></div>
                </div>

                <!-- Password Input Group -->
                <div class="form-group mb-4">
                    <div class="input-group">
                        <input class="form-control p-2 border-dark" id="password" type="password" placeholder="Password" name="password" required>
                        <!-- The icon is now in a button appended to the input group -->
                        <button class="btn btn-outline-dark" type="button" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                     <!-- Feedback div is now outside the input-group -->
                    <div class="invalid-feedback d-block"></div>
                </div>

                <div class="text-center mb-3">
                    <button class="btn btn-primary w-50" type="submit">Login</button>
                </div>
            </form>

            <p class="mt-3 text-center">
                Don't have an account? <a href="{{ url_for('register') }}">Register</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');

    // Helper function to show validation state
    const showValidation = (input, isValid, message) => {
        // FIX: Adjusted selector to find the feedback div in the new structure
        const feedback = input.closest('.form-group').querySelector('.invalid-feedback');
        if (isValid) {
            input.classList.remove('is-invalid');
            input.classList.add('is-valid');
            if (feedback) feedback.textContent = '';
        } else {
            input.classList.remove('is-valid');
            input.classList.add('is-invalid');
            if (feedback) feedback.textContent = message;
        }
    };

    // Email validation (no changes)
    const validateEmail = () => {
        const emailValue = email.value.trim();
        if (emailValue === '') {
            showValidation(email, false, 'Email address is required.');
            return false;
        }
        else if (!emailValue.endsWith('@skit.ac.in')) {
            showValidation(email, false, 'Email must be from the @skit.ac.in domain.');
            return false; 
        }
        else {
            showValidation(email, true, '');
            return true;
        }
    };

    // Password validation (no changes)
    const validatePassword = () => {
        const passwordValue = password.value.trim();
        if (passwordValue === '') {
            showValidation(password, false, 'Password is required.');
            return false;
        } else {
            showValidation(password, true, '');
            return true;
        }
    };

    email.addEventListener('blur', validateEmail);
    password.addEventListener('blur', validatePassword);

    // Event listener for the password toggle icon
    togglePassword.addEventListener('click', function() {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);

        // FIX: Target the icon INSIDE the button
        const icon = this.querySelector('i');
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    });

    form.addEventListener('submit', function(event) {
        const isEmailValid = validateEmail();
        const isPasswordValid = validatePassword();

        if (!isEmailValid || !isPasswordValid) {
            event.preventDefault();
            event.stopPropagation();
        }
    });
});
</script>
{% endblock %}
